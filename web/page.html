<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one column, a compact masthead, the board as the hero, controls in a single row beneath it. */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --cell: #ffffff;
  --cell-alt: #f6f7fb;
  --line: #d7dce6;
  --ink: #161b2e;
  --muted: #5d6680;
  --wall: #161b2e;
  --node: #161b2e;
  --node-ink: #ffffff;
  --spark-a: #ff8a1f;
  --spark-b: #e8336d;
  --trail: rgba(255, 138, 31, 0.13);
  --ok: #1f9d63;
  --focus: #3466ff;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131d; --panel: #181c29; --cell: #1c2130; --cell-alt: #191d2b; --line: #2d3346;
    --ink: #eef1f8; --muted: #9aa3bb; --wall: #eef1f8; --node: #eef1f8; --node-ink: #10131d;
    --trail: rgba(255, 138, 31, 0.16); --ok: #3ccf8e; --focus: #7d9bff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131d; --panel: #181c29; --cell: #1c2130; --cell-alt: #191d2b; --line: #2d3346;
  --ink: #eef1f8; --muted: #9aa3bb; --wall: #eef1f8; --node: #eef1f8; --node-ink: #10131d;
  --trail: rgba(255, 138, 31, 0.16); --ok: #3ccf8e; --focus: #7d9bff; color-scheme: dark;
}
/* Accessibility: high contrast drops the checkerboard and darkens lines and secondary text. */
:root[data-contrast="high"] { --line: #6f7890; --muted: #262c3f; --cell-alt: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root[data-contrast="high"]:not([data-theme="light"]) { --line: #8d97b0; --muted: #dfe4f0; --cell-alt: #1c2130; }
}
:root[data-contrast="high"][data-theme="dark"] { --line: #8d97b0; --muted: #dfe4f0; --cell-alt: #1c2130; }
:root[data-text="large"] { font-size: 112.5%; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 2.4rem; line-height: 1; margin: 0; letter-spacing: -0.02em; }
h1 span { background: linear-gradient(90deg, var(--spark-a), var(--spark-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tag { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
.modes { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.modes button { border: 0; background: transparent; color: var(--muted); font: 600 0.85rem var(--body); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sizes { display: flex; gap: 6px; }
.sizes[hidden], .lesson[hidden], .controls button[hidden] { display: none; }
.sizes button .tick { color: var(--ok); margin-left: 4px; }
.sizes button { min-width: 44px; padding: 0 12px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 600 0.85rem var(--body); cursor: pointer; font-variant-numeric: tabular-nums; }
.sizes button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.meta { display: flex; gap: 14px; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 600; }
.board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; }
.board {
  position: absolute; inset: 0; display: grid; border-radius: 14px; overflow: hidden;
  border: 2px solid var(--wall); background: var(--line); gap: 1px; touch-action: none; user-select: none; -webkit-user-select: none;
  cursor: crosshair; outline: none;
}
.board:focus-visible { box-shadow: 0 0 0 3px var(--focus); }
.cell { background: var(--cell); position: relative; transition: background-color 120ms; }
.cell.alt { background: var(--cell-alt); }
.cell.on { background: color-mix(in srgb, var(--cell) 86%, var(--spark-a)); }
.cell.hint { animation: hint 0.9s ease-in-out 3; }
@keyframes hint { 50% { background: color-mix(in srgb, var(--cell) 40%, var(--focus)); } }
/* Squares the line still has to cover: dotted in the tutorial, flashed when the line ends too early. */
.board-wrap.learning .cell:not(.on)::after { content: ""; position: absolute; inset: 0; margin: auto; width: 14%; height: 14%; border-radius: 50%; background: var(--muted); opacity: 0.5; }
.cell.missed { animation: missed 0.7s ease-in-out 2; }
@keyframes missed { 50% { background: color-mix(in srgb, var(--cell) 55%, var(--spark-b)); } }
[data-motion="reduced"] .cell.missed { animation: none; background: color-mix(in srgb, var(--cell) 75%, var(--spark-b)); }
svg.overlay { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); pointer-events: none; }
.node circle { fill: var(--node); }
.node text { fill: var(--node-ink); font-family: var(--display); font-weight: 800; text-anchor: middle; dominant-baseline: central; }
.node.done circle { fill: url(#sparkGrad); }
.node.done text { fill: #fff; }
.wall { stroke: var(--wall); stroke-linecap: round; }
.board-wrap.won .board { border-color: var(--ok); }
.board-wrap.won .board { transition: border-color 300ms; }
/* Completion: a spark runs the line from 1 to the end, cells and nodes light up as it passes, then the board bursts. */
.celebrate .cell { animation: cellFlash 520ms ease-out calc(var(--i, 0) * var(--step)) both; }
@keyframes cellFlash { 0% { background: var(--cell); } 35% { background: color-mix(in srgb, var(--cell) 45%, var(--spark-a)); } 100% { background: color-mix(in srgb, var(--cell) 86%, var(--spark-a)); } }
.celebrate .seg { animation: segSurge 520ms ease-out calc(var(--i, 0) * var(--step)) both; }
@keyframes segSurge { 40% { stroke-width: 0.6; filter: brightness(1.3) saturate(1.2); } }
.celebrate .node { transform-box: fill-box; transform-origin: center; animation: nodePop 460ms cubic-bezier(.3, 1.6, .5, 1) calc(var(--i, 0) * var(--step)) both; }
@keyframes nodePop { 45% { transform: scale(1.35); } }
/* Checkpoint hit: drawn on its own layer so later redraws don't cut it short. */
svg.fx { z-index: 1; }
.fx * { transform-box: fill-box; transform-origin: center; }
.fx .hit-node { animation: hitPop 520ms cubic-bezier(.3, 1.7, .5, 1) forwards; }
.fx .hit-node text { fill: #fff; font-family: var(--display); font-weight: 800; text-anchor: middle; dominant-baseline: central; }
@keyframes hitPop { 0% { transform: scale(0.8); } 40% { transform: scale(1.45); } 100% { transform: scale(1); opacity: 0; } }
.fx .hit-ring { fill: none; stroke: url(#fxGrad); stroke-width: 0.07; animation: hitRing 560ms ease-out forwards; }
@keyframes hitRing { 0% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(2.6); opacity: 0; } }
.fx .hit-spark { transform-box: view-box; transform-origin: 0 0; animation: hitSpark 520ms cubic-bezier(.15, .7, .3, 1) forwards; }
@keyframes hitSpark { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
.pulse { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; stroke-width: 0.16; stroke-dasharray: 0.03 1.2; stroke-dashoffset: 0.03; opacity: 0; filter: drop-shadow(0 0 0.12px #fff); animation: pulseRun var(--run) linear forwards; }
@keyframes pulseRun { 0% { opacity: 1; stroke-dashoffset: 0.03; } 96% { opacity: 1; } 100% { opacity: 0; stroke-dashoffset: -1; } }
.spark { transform-box: view-box; opacity: 0; animation: sparkFly 760ms cubic-bezier(.15, .7, .3, 1) var(--run) forwards; }
@keyframes sparkFly { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); } }
.ring { fill: none; stroke: url(#sparkGrad); stroke-width: 0.08; transform-box: fill-box; transform-origin: center; opacity: 0; animation: ringOut 700ms ease-out var(--run) forwards; }
@keyframes ringOut { 0% { opacity: 1; transform: scale(0.6); } 100% { opacity: 0; transform: scale(4); } }
.celebrate .board { animation: boardBump 520ms ease-out var(--run) both; }
@keyframes boardBump { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 30% { transform: scale(1.015); } 100% { box-shadow: 0 0 0 18px transparent; transform: none; } }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.controls button {
  flex: 1 1 0; min-width: 72px; height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); font: 600 0.92rem var(--body); cursor: pointer;
}
.controls button.confirm { border-color: var(--spark-b); color: var(--spark-b); }
.controls button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
.lesson { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.lesson small { color: var(--muted); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.lesson p { margin: 0; line-height: 1.45; text-wrap: balance; }
.lesson b { font-weight: 600; }
.win {
  position: absolute; inset: auto 12px 12px 12px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  box-shadow: 0 12px 40px rgba(10, 14, 30, 0.22); animation: rise 260ms ease-out; z-index: 2;
}
.win h2 { font-family: var(--display); font-weight: 800; font-size: 1.3rem; margin: 0; }
.win p { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.win button { height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--ink); color: var(--bg); font: 600 0.9rem var(--body); cursor: pointer; white-space: nowrap; }
.win { flex-wrap: wrap; }
.win .actions { display: flex; gap: 8px; }
.win button.share { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.win.gate { inset: 0; background: var(--bg); flex-direction: column; justify-content: center; text-align: center; }
.win.gate .actions { flex-wrap: wrap; justify-content: center; }
.win.gate h2 { font-size: 1.5rem; }
.energy { color: var(--ink); font-weight: 600; }
.version { margin: 4px 0 0; text-align: center; color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; user-select: text; -webkit-user-select: text; }
.version:empty { display: none; }
.energy[hidden] { display: none; }
.toast {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 3; max-width: calc(100% - 24px);
  background: var(--ink); color: var(--bg); font: 600 0.85rem var(--body); padding: 8px 14px; border-radius: 999px;
  animation: rise 200ms ease-out; pointer-events: none;
}
.toast.box { width: calc(100% - 24px); border-radius: 12px; pointer-events: auto; user-select: text; -webkit-user-select: text; white-space: pre-wrap; font-weight: 500; }
@keyframes rise { from { transform: translateY(10px); opacity: 0.4; } }
:root[data-motion="reduced"] *, :root[data-motion="reduced"] *::before, :root[data-motion="reduced"] *::after { animation: none !important; transition: none !important; }
:root[data-text="large"] body { font-size: 17px; }
.head-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sheet {
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(10, 14, 30, 0.45);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet[hidden] { display: none; }
@media (min-width: 560px) { .sheet { align-items: center; } }
.sheet-card {
  width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; background: var(--panel); color: var(--ink);
  border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 18px; animation: rise 220ms ease-out;
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h2 { font-family: var(--display); font-weight: 800; font-size: 1.35rem; margin: 0; }
.sheet-head button { height: 38px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--ink); color: var(--bg); font: 600 0.9rem var(--body); cursor: pointer; }
.opt { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.opt legend { font-weight: 600; padding: 0; margin-bottom: 2px; }
.opt .desc { margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
.seg { display: flex; gap: 4px; background: var(--bg); border-radius: 12px; padding: 4px; }
.seg label { flex: 1 1 0; position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; text-align: center; padding: 9px 6px; border-radius: 9px; font-weight: 600; font-size: 0.88rem; color: var(--muted); }
.seg input:checked + span { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(10, 14, 30, 0.18); }
.seg input:focus-visible + span, .switch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 1px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
.switch .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.switch .txt b { font-weight: 600; }
.switch .txt small { color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch span.track { flex: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; transition: background-color 150ms; }
.switch span.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(10, 14, 30, 0.3); transition: transform 150ms; }
.switch input:checked + span.track { background: var(--ok); }
.switch input:checked + span.track::after { transform: translateX(20px); }
.opt[hidden], .desc[hidden] { display: none; }
.time-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 0.9rem; }
.time-row input { font: 600 1rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.time-row input:disabled { opacity: 0.5; }
.lang-row select { font: 600 0.95rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.ads-txt { display: flex; flex-direction: column; gap: 2px; }
.ads-txt b { font-weight: 600; }
.ads-txt small { color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
.ads-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ads-row button { height: 38px; padding: 0 14px; border-radius: 10px; font: 600 0.9rem var(--body); cursor: pointer; }
#ads-buy { border: 0; background: var(--ink); color: var(--bg); }
#ads-buy:disabled { opacity: 0.5; cursor: default; }
.ads-row .link { border: 1px solid var(--line); background: transparent; color: var(--ink); }
.ads-row button[hidden] { display: none; }
@media (max-width: 420px) { h1 { font-size: 2rem; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Zip<span>Zap</span>Zop</h1>
      <div class="tag" data-i18n="tag">One line. Every cell. Numbers in order.</div>
    </div>
    <div class="head-actions">
      <div class="modes" role="group" aria-label="Mode" data-i18n-aria="mode_group">
        <button id="mode-daily" aria-pressed="true" data-i18n="daily">Daily</button>
        <button id="mode-ladder" aria-pressed="false" data-i18n="ladder">Ladder</button>
        <button id="mode-learn" aria-pressed="false" data-i18n="learn">Learn</button>

      <button class="icon-btn" id="a11y-open" aria-label="Settings" aria-haspopup="dialog" title="Settings" data-i18n-aria="settings" data-i18n-title="settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="lesson" id="lesson" aria-live="polite" hidden><small id="lesson-step"></small><p id="lesson-text"></p></div>

  </div>

  <div class="controls">
    <button id="undo" data-i18n="undo">Undo</button>
    <button id="hint">Hint</button>
    <button id="clear" data-i18n="clear">Clear</button>
    <button id="new" class="primary" data-i18n="new_puzzle">New puzzle</button>
  </div>

  <div class="sr-only" id="announce" aria-live="polite"></div>
</div>

<div class="sheet" id="a11y" role="dialog" aria-modal="true" aria-labelledby="a11y-title" hidden>
  <div class="sheet-card">

  if (telemetry && telemetry.pageError) {
    window.addEventListener('error', (e) => { try { telemetry.pageError(`${e.message} at ${e.lineno}:${e.colno}`); } catch (_) {} });

    let start = 1;

      hints_none: 'nenhuma dica', hints_one: '1 dica', hints_many: '{n} dicas', copied: 'Resultado copiado',
      missed: 'Quase! A linha precisa passar por todas as casas. Faltam {n}.', reached: '{k} de {total} alcançado', solved_announce: 'Resolvido em {time}',

      msg_purchase_screen: 'Não foi possível abrir a tela de compra do Google Play. Tente mais tarde.',

      msg_pending: 'Sua compra está pendente. Os anúncios saem quando ela for concluída.',
      msg_restored: 'Compra restaurada. Anúncios desativados.',
      msg_no_purchase: 'Nenhuma compra encontrada nesta conta Google.',
      msg_play_unreachable: 'Não foi possível acessar o Google Play. Tente mais tarde.',
    },
  };

  let lang = 'en';
  function pickLang() {
    const chosen = store.get('lang', 'system');
    if (chosen !== 'system' && STRINGS[chosen]) return chosen;
    for (const l of navigator.languages || [navigator.language || 'en']) {
      const code = String(l).slice(0, 2).toLowerCase();
      if (STRINGS[code]) return code;
    }
    return 'en';
  }
  function t(key, vars) {
    let str = (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;
    if (vars) str = str.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
    return str;
  }
  lang = pickLang();

  // Tutorial rounds: tiny hand-made puzzles, each teaching one rule. Cells are numbered row by row.
  const LESSONS = [
    { n: 3, nums: { 0: 1, 8: 2 }, walls: [], solution: [0, 1, 2, 5, 4, 3, 6, 7, 8],
      text: 'lesson1' },
    { n: 3, nums: { 0: 1, 6: 2, 8: 3 }, walls: [], solution: [0, 3, 6, 7, 4, 1, 2, 5, 8],
      text: 'lesson2' },
    { n: 4, nums: { 0: 1, 3: 2 }, walls: ['4-5', '9-10', '6-7', '13-14'], solution: [0, 4, 8, 12, 13, 9, 5, 1, 2, 6, 10, 14, 15, 11, 7, 3],
      text: 'lesson3' },
    { n: 4, nums: { 0: 1, 3: 2, 4: 3, 9: 4, 11: 5 }, walls: ['5-9', '10-11', '2-6'], solution: [0, 1, 2, 3, 7, 6, 5, 4, 8, 12, 13, 9, 10, 14, 15, 11],
      text: 'lesson4' },
  ];
  let lesson = Math.min(store.get('lesson', 0), LESSONS.length - 1);
  // New players start in the tutorial; returning players keep their last mode.
  let mode = store.get('mode', store.get('tutorialDone', false) ? 'daily' : 'learn');
  let dailyId = store.get('dailyDiff', 'easy');
  let level = store.get('ladderLevel', 1);
  if (mode === 'practice') mode = 'ladder'; // older saves
  const daily = () => DAILY.find((d) => d.id === dailyId) || DAILY[0];
  const dailyKey = (id) => 'daily:' + today() + ':' + (id || dailyId);
  let puz, path, won, startTime, elapsed, timerId, cells = [];
  let celebrate = false, celebrateTimer = null, hintsUsed = 0;
  // Accessibility settings, kept per device. "system" follows the phone or browser setting.
  const rootEl = document.documentElement;
  const hostTheme = rootEl.getAttribute('data-theme');
  const motionQuery = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  const a11y = Object.assign({ motion: 'system', theme: 'system', contrast: false, large: false }, store.get('a11y', {}));
  const reducedMotion = () => rootEl.dataset.motion === 'reduced';
  const nodeSize = () => (a11y.large ? { r: 0.36, f: 0.4 } : { r: 0.3, f: 0.32 });

  function applyA11y() {
    const systemReduced = !!(motionQuery && motionQuery.matches);
    rootEl.dataset.motion = a11y.motion === 'off' || (a11y.motion === 'system' && systemReduced) ? 'reduced' : 'full';
    if (a11y.theme !== 'system') rootEl.setAttribute('data-theme', a11y.theme);
    else if (hostTheme) rootEl.setAttribute('data-theme', hostTheme);
    else rootEl.removeAttribute('data-theme');
    if (a11y.contrast) rootEl.dataset.contrast = 'high'; else delete rootEl.dataset.contrast;
    if (a11y.large) rootEl.dataset.text = 'large'; else delete rootEl.dataset.text;
    $('motion-note').textContent = systemReduced ? t('motion_note') : '';
    if (puz) render();
  }

  function announce(msg) { const el = $('announce'); el.textContent = ''; setTimeout(() => (el.textContent = msg), 30); }

  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const fmt = (ms) => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  function buildSizes() {
    const box = $('sizes'); box.innerHTML = '';
    for (const d of DAILY) {
      const b = document.createElement('button');
      const done = store.get(dailyKey(d.id), null) != null;
      b.innerHTML = t(d.id) + (done ? `<span class="tick" aria-label="${t('solved_mark')}">✓</span>` : '');
      b.setAttribute('aria-pressed', String(d.id === dailyId));
      b.onclick = () => { dailyId = d.id; store.set('dailyDiff', dailyId); load(); };
      box.appendChild(b);
    }
  }

  function load() {
    buildSizes();
    $('mode-daily').setAttribute('aria-pressed', String(mode === 'daily'));
    $('mode-ladder').setAttribute('aria-pressed', String(mode === 'ladder'));
    $('mode-learn').setAttribute('aria-pressed', String(mode === 'learn'));
    const learn = mode === 'learn';
    $('lesson').hidden = !learn; $('sizes').hidden = mode !== 'daily';
    wrap.classList.toggle('learning', learn);
    $('new').hidden = !learn;
    if (learn) {
      const L = LESSONS[lesson];
      puz = { n: L.n, nums: L.nums, walls: new Set(L.walls), solution: L.solution, unique: true };
      $('lesson-step').textContent = t('lesson_step', { n: lesson + 1, total: LESSONS.length });
      $('lesson-text').innerHTML = t(L.text);
    } else if (mode === 'daily') {
      const d = daily();
      puz = E.generate(d.n, E.hashString('zap/' + today() + '/' + d.id), d.opts);
    } else {
      const spec = ladderSpec(level);
      puz = E.generate(spec.n, E.hashString('zap/ladder/' + level), spec.opts);
    }
    path = []; won = false; elapsed = 0; startTime = null;
    celebrate = false; clearTimeout(celebrateTimer); wrap.classList.remove('celebrate');
    hintsUsed = mode === 'daily' ? store.get('dailyhints:' + today() + ':' + dailyId, 0) : 0;
    clearInterval(timerId); timerId = null;
    $('label').textContent = learn ? t('how_to_play') : mode === 'daily' ? today() : t('level_size', { level, size: puz.n });
    const saved = mode === 'daily' && store.get(dailyKey(), null);
    closeGate();
    buildBoard();
    if (saved) { path = puz.solution.slice(); won = true; elapsed = saved; }
    render();
    if (!payLadderLevel()) showGate();
    showEnergy();
  }

  function buildBoard() {
    const n = puz.n;
    board.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    board.innerHTML = ''; cells = [];
    for (let i = 0; i < n * n; i++) {
      const d = document.createElement('div');
      d.className = 'cell' + (((Math.floor(i / n) + i) % 2) ? ' alt' : '');
      board.appendChild(d); cells.push(d);
    }
  }

  function lerpColor(t) {
    const a = [255, 138, 31], b = [232, 51, 109];
    return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
  }

  function render() {
    const n = puz.n, on = new Set(path);
    cells.forEach((c, i) => c.classList.toggle('on', on.has(i)));
    const ctr = (i) => [(i % n) + 0.5, Math.floor(i / n) + 0.5];
    let s = `<defs><linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a1f"/><stop offset="1" stop-color="#e8336d"/></linearGradient></defs>`;
    overlay.setAttribute('viewBox', `0 0 ${n} ${n}`);
    // path segments, coloured along their length
    for (let k = 1; k < path.length; k++) {
      const [x1, y1] = ctr(path[k - 1]), [x2, y2] = ctr(path[k]);
      s += `<line class="seg" style="--i:${k}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lerpColor(k / (n * n - 1))}" stroke-width="0.4" stroke-linecap="round"/>`;
    }
    if (path.length) {
      const [hx, hy] = ctr(path[path.length - 1]);
      s += `<circle cx="${hx}" cy="${hy}" r="0.2" fill="${lerpColor((path.length - 1) / (n * n - 1))}"/>`;
    }
    // walls
    for (const key of puz.walls) {
      const [a, b] = key.split('-').map(Number);
      const ra = Math.floor(a / n), ca = a % n;
      const ln = b - a === 1 ? [ca + 1, ra, ca + 1, ra + 1] : [ca, ra + 1, ca + 1, ra + 1];
      s += `<line class="wall" x1="${ln[0]}" y1="${ln[1]}" x2="${ln[2]}" y2="${ln[3]}" stroke-width="${a11y.contrast ? 0.14 : 0.09}"/>`;
    }
    // checkpoints
    const reached = reachedCount();
    for (const [cell, k] of Object.entries(puz.nums)) {
      const [x, y] = ctr(+cell);
      s += `<g class="node${k <= reached ? ' done' : ''}" style="--i:${Math.max(0, path.indexOf(+cell))}"><circle cx="${x}" cy="${y}" r="${nodeSize().r}"/><text x="${x}" y="${y + 0.01}" font-size="${nodeSize().f}">${k}</text></g>`;
    }
    const party = won && celebrate && !reducedMotion();
    const step = Math.max(18, Math.min(60, 1500 / path.length));
    const run = Math.round(step * path.length);
    if (party) {
      s += `<polyline class="pulse" pathLength="1" points="${path.map((c) => ctr(c).join(',')).join(' ')}"/>`;
      const [ex, ey] = ctr(path[path.length - 1]);
      s += `<circle class="ring" cx="${ex}" cy="${ey}" r="0.3"/>`;
      for (let k = 0; k < 20; k++) {
        const a = (k / 20) * Math.PI * 2 + Math.random() * 0.3, d = 1 + Math.random() * 1.4;
        s += `<circle class="spark" cx="${ex}" cy="${ey}" r="${(0.07 + Math.random() * 0.07).toFixed(3)}" fill="${lerpColor(k / 19)}" style="--dx:${(Math.cos(a) * d).toFixed(2)}px;--dy:${(Math.sin(a) * d).toFixed(2)}px"/>`;
      }
    }
    overlay.innerHTML = s;
    wrap.classList.toggle('won', won);
    wrap.style.setProperty('--step', step + 'ms');
    wrap.style.setProperty('--run', run + 'ms');
    if (party) { path.forEach((c, i) => cells[c].style.setProperty('--i', i)); wrap.classList.add('celebrate'); }
    $('undo').disabled = won || !path.length;
    $('clear').disabled = won || !path.length;
    $('hint').disabled = won;
    hintLabel();
    $('timer').textContent = fmt(elapsed);
    const old = wrap.querySelector('.win'); if (old) old.remove();
    clearTimeout(celebrateTimer);
    if (won && party) {
      celebrate = false;
      celebrateTimer = setTimeout(() => { showWin(); }, run + 650);
    } else if (won) showWin();
  }

  // Index of the last number on the line. When a drag ends, the line is trimmed back to it.
  function lockIndex() {
    for (let i = path.length - 1; i >= 0; i--) if (puz.nums[path[i]]) return i;
    return -1;
  }

  function reachedCount() {
    let r = 0;
    for (const c of path) { const k = puz.nums[c]; if (k) r = k; }
    return r;
  }

  function showWin() {
    const div = document.createElement('div');
    div.className = 'win';
    if (mode === 'learn') {
      const last = lesson === LESSONS.length - 1;
      div.innerHTML = `<div><h2>${t(last ? 'win_ready' : 'win_nice')}</h2><p>${t('lesson_done', { n: lesson + 1, total: LESSONS.length })}</p></div><div class="actions"><button class="next">${t(last ? 'play_today' : 'next_lesson')}</button></div>`;
      div.querySelector('.next').onclick = () => {
        if (last) { finishTutorial(); return; }
        lesson++; store.set('lesson', lesson); load();
      };
      wrap.appendChild(div);
      return;
    }
    const next = nextDaily();
    const what = mode === 'daily' ? t(daily().id) : t('level', { level });
    const nextLabel = mode === 'ladder' ? t('level', { level: level + 1 }) : next ? t('play_x', { label: t(next.id) }) : t('play_ladder');
    div.innerHTML = `<div><h2>${t('solved')}</h2><p>${t('solved_in', { what, time: fmt(elapsed) })}</p></div><div class="actions"><button class="share">${t('share')}</button><button class="next">${nextLabel}</button></div>`;
    div.querySelector('.next').onclick = nextPuzzle;
    div.querySelector('.share').onclick = share;
    wrap.appendChild(div);
  }

  function shareText() {
    const which = mode === 'daily' ? t('share_daily', { date: today(), label: t(daily().id) }) : t('share_ladder', { level });
    const hints = !hintsUsed ? t('hints_none') : hintsUsed === 1 ? t('hints_one') : t('hints_many', { n: hintsUsed });
    return `ZipZapZop ${which}\n⚡ ${t('share_line', { time: fmt(elapsed), hints })}`;
  }

  function toast(msg, box) {
    const old = wrap.querySelector('.toast'); if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'toast' + (box ? ' box' : ''); t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => t.remove(), box ? 8000 : 2200);
  }

  // Android app: native share sheet. Browsers: Web Share, then clipboard, then show the text to copy by hand.
  async function share() {
    const text = shareText();
    if (window.ZipZapZopAndroid) { window.ZipZapZopAndroid.share(text); return; }
    if (navigator.share) {
      try { await navigator.share({ text }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(text); toast(t('copied')); }
    catch { toast(text, true); }
  }

  function finishTutorial() {
    store.set('tutorialDone', true); lesson = 0; store.set('lesson', 0);
    mode = 'daily'; store.set('mode', mode); load();
  }

  // The next of today's dailies still unsolved, after the current one.
  function nextDaily() {
    const i = DAILY.findIndex((d) => d.id === dailyId);
    for (let k = 1; k < DAILY.length; k++) {
      const d = DAILY[(i + k) % DAILY.length];
      if (store.get(dailyKey(d.id), null) == null) return d;
    }
    return null;
  }

  function nextPuzzle() {
    if (mode === 'learn') { finishTutorial(); return; }
    if (mode === 'ladder') { level++; store.set('ladderLevel', level); }
    else {
      const d = nextDaily();
      if (d) { dailyId = d.id; store.set('dailyDiff', dailyId); }
      else { mode = 'ladder'; store.set('mode', mode); }
    }
    load();
  }

  function tick() { elapsed = Date.now() - startTime; $('timer').textContent = fmt(elapsed); }
  function startTimer() {
    if (startTime || won) return;
    if (!elapsed && mode !== 'learn') track('puzzle_start', puzzleInfo());
    startTime = Date.now() - elapsed;
    timerId = setInterval(tick, 250);
  }

  function canStep(from, to) {
    if (!E.neighbors(puz.n, from).includes(to)) return false;
    if (puz.walls.has(E.wallKey(from, to))) return false;
    if (path.includes(to)) return false;
    const k = puz.nums[to];
    if (k && k !== reachedCount() + 1) return false;
    return true;
  }

  // Try to move the head to `cell`. Returns true if the path changed.
  function moveTo(cell) {
    if (won) return false;
    if (!path.length) {
      if (puz.nums[cell] === 1) { path.push(cell); startTimer(); hitFx(cell); return true; }
      return false;
    }
    const head = path[path.length - 1];
    if (cell === head) return false;
    const at = path.indexOf(cell);
    if (at >= 0) { path.length = at + 1; return true; }
    if (canStep(head, cell)) {
      path.push(cell); checkWin();
      if (puz.nums[cell] && !won) { hitFx(cell); if (puz.nums[cell] === Object.keys(puz.nums).length) showMissed(); }
      return true;
    }
    return false;
  }

  // The line reached the last number with squares left over: point at them.
  function showMissed() {
    const on = new Set(path), left = [];
    cells.forEach((c, i) => { if (!on.has(i)) left.push(c); });
    left.forEach((c) => { c.classList.remove('missed'); void c.offsetWidth; c.classList.add('missed'); });
    setTimeout(() => left.forEach((c) => c.classList.remove('missed')), 1500);
    const msg = t('missed', { n: left.length });
    toast(msg); announce(msg);
  }

  // Pop, ring and sparks on a checkpoint the line just reached.
  function hitFx(cell) {
    announce(t('reached', { k: puz.nums[cell], total: Object.keys(puz.nums).length }));
    if (reducedMotion()) return;
    const fx = $('fx'), n = puz.n, ns = 'http://www.w3.org/2000/svg';
    fx.setAttribute('viewBox', `0 0 ${n} ${n}`);
    const x = (cell % n) + 0.5, y = Math.floor(cell / n) + 0.5;
    const g = document.createElementNS(ns, 'g');
    let h = `<circle class="hit-ring" cx="${x}" cy="${y}" r="0.32"/>`;
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2 + Math.random() * 0.4, d = 0.55 + Math.random() * 0.35;
      h += `<circle class="hit-spark" cx="${x}" cy="${y}" r="0.055" fill="${lerpColor(k / 7)}" style="--dx:${(Math.cos(a) * d).toFixed(2)}px;--dy:${(Math.sin(a) * d).toFixed(2)}px"/>`;
    }
    h += `<g class="hit-node"><circle cx="${x}" cy="${y}" r="${nodeSize().r}" fill="url(#fxGrad)"/><text x="${x}" y="${y + 0.01}" font-size="${nodeSize().f}">${puz.nums[cell]}</text></g>`;
    g.innerHTML = h;
    fx.appendChild(g);
    setTimeout(() => g.remove(), 700);
  }

  function checkWin() {
    if (E.isSolved(puz, path)) {
      won = true; celebrate = true; tick(); clearInterval(timerId); timerId = null;
      announce(t('solved_announce', { time: fmt(elapsed) }));
      if (mode !== 'learn') track('puzzle_solve', Object.assign(puzzleInfo(), { seconds: Math.round(elapsed / 1000), hints: hintsUsed }));
      else if (lesson === LESSONS.length - 1) track('tutorial_complete');
      if (mode === 'learn') { if (lesson === LESSONS.length - 1) store.set('tutorialDone', true); }
      else if (window.zzzArmReminder) window.zzzArmReminder();
      if (mode === 'daily') {
        store.set(dailyKey(), elapsed); store.set('dailyhints:' + today() + ':' + dailyId, hintsUsed); buildSizes();
        const bridge = window.ZipZapZopAndroid;
        if (!nextDaily() && bridge && bridge.dailiesDone) bridge.dailiesDone(today());
      }
    }
  }

  function cellAt(x, y) {
    const r = board.getBoundingClientRect(), n = puz.n;
    const c = Math.floor(((x - r.left) / r.width) * n), rr = Math.floor(((y - r.top) / r.height) * n);
    if (c < 0 || rr < 0 || c >= n || rr >= n) return -1;
    return rr * n + c;
  }

  // Step through intermediate cells when a fast drag skips over some.
  function dragTo(cell) {
    if (cell < 0) return false;
    let changed = false;
    for (let guard = 0; guard < 64; guard++) {
      if (!path.length) return moveTo(cell) || changed;
      const head = path[path.length - 1];
      if (cell === head) break;
      if (path.includes(cell) || E.neighbors(puz.n, head).includes(cell)) return moveTo(cell) || changed;
      const n = puz.n, hr = Math.floor(head / n), hc = head % n, tr = Math.floor(cell / n), tc = cell % n;
      const dr = tr - hr, dc = tc - hc;
      const step = Math.abs(dr) >= Math.abs(dc) ? head + Math.sign(dr) * n : head + Math.sign(dc);
      const alt = Math.abs(dr) >= Math.abs(dc) ? (dc ? head + Math.sign(dc) : -1) : (dr ? head + Math.sign(dr) * n : -1);
      if (moveTo(step)) { changed = true; continue; }
      if (alt >= 0 && moveTo(alt)) { changed = true; continue; }
      break;
    }
    return changed;
  }

  // A drag edits the line only when it starts at the head or on an empty cell.
  // Pressing an earlier part of the line does nothing unless held, so a stray
  // touch can't wipe progress; holding cuts the line back to that cell.
  const HOLD_MS = 450;
  let dragging = false, armed = false, holdTimer = null, holdCell = -1;
  const clearHold = () => { clearTimeout(holdTimer); holdTimer = null; holdCell = -1; };
  board.addEventListener('pointerdown', (e) => {
    if (won) return;
    const cell = cellAt(e.clientX, e.clientY);
    if (cell < 0) return;
    if (!path.length && puz.nums[cell] !== 1) return;
    dragging = true; board.setPointerCapture(e.pointerId);
    const at = path.indexOf(cell);
    if (at >= 0 && at < path.length - 1) {
      armed = false; holdCell = cell;
      holdTimer = setTimeout(() => {
        holdTimer = null;
        if (!dragging || won) return;
        path.length = at + 1; armed = true; render();
        const c = cells[cell];
        c.classList.remove('hint'); void c.offsetWidth; c.classList.add('hint');
        if (navigator.vibrate) try { navigator.vibrate(12); } catch (_) {}
      }, HOLD_MS);
      return;
    }
    armed = true;
    if (path.length && at < 0) { if (dragTo(cell)) render(); return; }
    if (moveTo(cell)) render();
  });
  board.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const cell = cellAt(e.clientX, e.clientY);
    if (!armed) { if (holdTimer && cell !== holdCell) clearHold(); return; }
    if (dragTo(cell)) render();
  });
  const end = (e) => {
    if (!dragging) return;
    dragging = false; clearHold();
    const wasArmed = armed; armed = false;
    // A cancelled touch (system gesture, call, etc.) isn't a release: leave the line alone.
    if (!wasArmed || (e && e.type === 'pointercancel')) return;
    const keep = lockIndex() + 1;
    if (!won && keep < path.length) { path.length = keep; render(); }
  };
  board.addEventListener('pointerup', end);
  board.addEventListener('pointercancel', end);

  board.addEventListener('keydown', (e) => {
    if (won) return;
    const n = puz.n;
    const d = { ArrowUp: -n, ArrowDown: n, ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (d !== undefined) {
      e.preventDefault();
      if (!path.length) { const one = +Object.keys(puz.nums).find((c) => puz.nums[c] === 1); moveTo(one); render(); return; }
      const head = path[path.length - 1];
      const to = head + d;
      if ((d === 1 && to % n === 0) || (d === -1 && head % n === 0) || to < 0 || to >= n * n) return;
      if (moveTo(to)) render();
    } else if (e.key === 'Backspace' || (e.key === 'z' && (e.metaKey || e.ctrlKey))) {
      e.preventDefault(); undo();
    }
  });

  // Steps back to the previous number on the line.
  function undo() {
    if (won || !path.length) return;
    path.pop();
    path.length = lockIndex() + 1;
    render();
  }

  function hint() {
    if (won) return;
    const sol = puz.solution;
    let ok = 0;
    while (ok < path.length && path[ok] === sol[ok]) ok++;
    if (ok < path.length) { path.length = Math.max(ok, 0); }
    // Reveal the route up to the next number, so the line rests on a number like after a drag.
    if (!path.length) { path.push(sol[0]); startTimer(); }
    else do path.push(sol[path.length]); while (!puz.nums[path[path.length - 1]]);
    elapsed += 10000; // each hint costs ten seconds
    hintsUsed++;
    if (startTime) startTime -= 10000;
    checkWin(); render();
    if (puz.nums[path[path.length - 1]] && !won) hitFx(path[path.length - 1]);
    const c = cells[path[path.length - 1]];
    c.classList.remove('hint'); void c.offsetWidth; c.classList.add('hint');
  }

  // In the Android app with ads, hints are rationed: FREE_HINTS a day across Daily and Ladder, then one
  // finished rewarded ad per extra hint. Learn, the browser version and Remove ads buyers stay unlimited.
  const FREE_HINTS = 3;
  let hintAdArmed = null, hintAdPending = false;
  const hintsMetered = () => mode !== 'learn' && !!lastAdsState && lastAdsState.available && !lastAdsState.adsRemoved;
  const hintsToday = () => { const h = store.get('hintday', null); return h && h.d === today() ? h.n : 0; };
  const freeHintsLeft = () => Math.max(0, FREE_HINTS - hintsToday());
  function hintLabel() {
    const b = $('hint');
    b.classList.toggle('confirm', !!hintAdArmed);
    if (!hintsMetered()) b.textContent = t('hint');
    else if (hintAdArmed) b.textContent = t('hint_watch');
    else { const n = freeHintsLeft(); b.textContent = n ? t('hint_left', { n }) : t('hint_ad'); }
  }
  function disarmHintAd() { clearTimeout(hintAdArmed); hintAdArmed = null; }
  function hintTap() {
    if (won || hintAdPending || wrap.querySelector('.gate')) return;
    if (!hintsMetered()) { hint(); return; }
    if (freeHintsLeft()) { store.set('hintday', { d: today(), n: hintsToday() + 1 }); hint(); return; }
    // Out of free hints: the first tap explains, the second opts in to the ad.
    if (!hintAdArmed) {
      hintAdArmed = setTimeout(() => { hintAdArmed = null; hintLabel(); }, 4000);
      toast(t('hints_out')); hintLabel();
      return;
    }
    disarmHintAd(); hintAdPending = true; hintLabel();
    watchAd('hint');
  }

  // Ladder energy, also only with ads in the Android app: each new Ladder level costs 1, it refills by
  // 1 every ENERGY_REFILL_MS up to ENERGY_MAX, and a finished rewarded ad adds ENERGY_AD.
  const ENERGY_MAX = 5, ENERGY_REFILL_MS = 30 * 60 * 1000, ENERGY_AD = 3;
  let gateTimer = null;
  const energyMetered = () => !!lastAdsState && lastAdsState.available && !lastAdsState.adsRemoved;
  // Current energy as { n, t }: t is when the next refill started counting.
  function energyNow() {
    const now = Date.now();
    let e = store.get('energy', null);
    if (!e || typeof e.n !== 'number' || !(e.t <= now)) e = { n: e && typeof e.n === 'number' ? e.n : ENERGY_MAX, t: now };
    const gained = Math.floor((now - e.t) / ENERGY_REFILL_MS);
    if (e.n >= ENERGY_MAX) e = { n: e.n, t: now };
    else if (gained > 0) { const n = Math.min(ENERGY_MAX, e.n + gained); e = { n, t: n >= ENERGY_MAX ? now : e.t + gained * ENERGY_REFILL_MS }; }
    store.set('energy', e);
    return e;
  }
  const nextRefillIn = (e) => Math.max(0, ENERGY_REFILL_MS - (Date.now() - e.t));
  function addEnergy(k) { const e = energyNow(); store.set('energy', { n: Math.max(0, Math.min(ENERGY_MAX, e.n + k)), t: e.t }); }
  function showEnergy() {
    const el = $('energy');
    el.hidden = mode !== 'ladder' || !energyMetered();
    if (el.hidden) return;
    const e = energyNow();
    el.textContent = '⚡ ' + e.n + '/' + ENERGY_MAX;
    el.setAttribute('aria-label', t('energy_label', { n: e.n, max: ENERGY_MAX }));
    el.title = e.n < ENERGY_MAX ? t('energy_next', { time: fmt(nextRefillIn(e)) }) : '';
  }
  // Pays for the current Ladder level the first time it is opened. False when out of energy.
  function payLadderLevel() {
    if (mode !== 'ladder' || !energyMetered() || store.get('ladderPaid', 0) >= level) return true;
    if (energyNow().n < 1) return false;
    addEnergy(-1); store.set('ladderPaid', level);
    return true;
  }
  function closeGate() {
    clearInterval(gateTimer); gateTimer = null;
    const g = wrap.querySelector('.gate'); if (g) g.remove();
    $('board').inert = false;
  }
  function showGate() {
    closeGate();
    $('board').inert = true;
    for (const id of ['undo', 'hint', 'clear']) $(id).disabled = true;
    const div = document.createElement('div');
    div.className = 'win gate';
    div.innerHTML = `<div><h2>${t('energy_out')}</h2><p class="when"></p></div><div class="actions"><button class="share daily">${t('energy_daily')}</button><button class="next">${t('energy_watch', { n: ENERGY_AD })}</button></div>`;
    div.querySelector('.next').onclick = () => watchAd('energy');
    div.querySelector('.daily').onclick = () => { closeGate(); mode = 'daily'; store.set('mode', mode); load(); };
    wrap.appendChild(div);
    const update = () => {
      const e = energyNow();
      if (e.n > 0) { load(); return; } // refilled while waiting
      div.querySelector('.when').textContent = t('energy_text', { time: fmt(nextRefillIn(e)) });
      showEnergy();
    };
    update();
    if (div.isConnected) { gateTimer = setInterval(update, 1000); div.querySelector('.next').focus(); }
    track('energy_empty', { level });
  }

  // Rewarded ads, for an extra hint or for energy. The app answers through zzzRewardedAd.
  let adPending = false;
  function watchAd(purpose) {
    if (adPending) return;
    adPending = true;
    if (purpose === 'hint') hintAdPending = true;
    track('rewarded_ad_start', Object.assign(puzzleInfo(), { purpose }));
    window.ZipZapZopAndroid.watchRewardedAd(purpose);
  }
  // result: 'reward' (watched to the end), 'closed' (left early) or 'unavailable'.
  window.zzzRewardedAd = (purpose, result) => {
    adPending = false; hintAdPending = false;
    track('rewarded_ad_result', Object.assign(puzzleInfo(), { purpose, result }));
    if (result === 'unavailable') toast(t('ad_unavailable'));
    if (purpose === 'hint') { if (result === 'reward') hint(); hintLabel(); }
    else if (purpose === 'energy' && result === 'reward') { addEnergy(ENERGY_AD); if (wrap.querySelector('.gate')) load(); else showEnergy(); }
  };

  $('undo').onclick = undo;
  // Clear asks for a second tap so one mis-hit can't erase the whole line.
  let clearArmed = null;
  $('clear').onclick = () => {
    if (won || !path.length) return;
    const b = $('clear');
    if (!clearArmed) {
      b.textContent = t('tap_again'); b.classList.add('confirm');
      clearArmed = setTimeout(() => { clearArmed = null; b.textContent = t('clear'); b.classList.remove('confirm'); }, 2500);
      return;
    }
    clearTimeout(clearArmed); clearArmed = null; b.textContent = t('clear'); b.classList.remove('confirm');
    path = []; render();
  };
  $('hint').onclick = hintTap;
  $('new').onclick = nextPuzzle;
  $('mode-daily').onclick = () => { mode = 'daily'; store.set('mode', mode); load(); };
  $('mode-learn').onclick = () => { mode = 'learn'; lesson = 0; store.set('lesson', 0); store.set('mode', mode); load(); };
  $('mode-ladder').onclick = () => { mode = 'ladder'; store.set('mode', mode); load(); };

  const sheet = $('a11y');
  function openA11y() {
    for (const k of ['motion', 'theme']) $(k + '-' + a11y[k]).checked = true;
    $('opt-contrast').checked = a11y.contrast; $('opt-large').checked = a11y.large;
    sheet.hidden = false;
    sheet.querySelector('input:checked').focus();
  }
  function closeA11y() { sheet.hidden = true; $('a11y-open').focus(); }
  function saveA11y() { store.set('a11y', a11y); applyA11y(); }
  $('a11y-open').onclick = openA11y;
  $('a11y-close').onclick = closeA11y;
  sheet.addEventListener('click', (e) => { if (e.target === sheet) closeA11y(); });
  sheet.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeA11y(); }
    if (e.key === 'Tab') { // keep focus inside the dialog
      const f = [...sheet.querySelectorAll('button, input')].filter((el) => el.type !== 'radio' || el.checked);
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  sheet.querySelectorAll('input[type=radio]').forEach((r) => r.addEventListener('change', () => { a11y[r.name] = r.value; saveA11y(); }));
  $('opt-contrast').onchange = (e) => { a11y.contrast = e.target.checked; saveA11y(); };
  $('opt-large').onchange = (e) => { a11y.large = e.target.checked; saveA11y(); };

  // Daily reminder: only in the Android app, which schedules a local notification.
  const bridge = window.ZipZapZopAndroid;
  // On by default at 09:00. It is switched on for real (asking for notification permission on
  // Android 13+) after the first solved Daily or Ladder puzzle, unless the player set it already.
  const reminder = Object.assign({ on: true, time: '09:00' }, store.get('reminder', {}));
  function syncReminderUi() {
    $('opt-reminder').checked = reminder.on;
    $('opt-reminder-time').value = reminder.time;
    $('opt-reminder-time').disabled = !reminder.on;
  }
  function saveReminder() {
    store.set('reminder', reminder); syncReminderUi();
    const [h, m] = reminder.time.split(':').map(Number);
    bridge.setReminder(reminder.on, h, m);
  }
  if (bridge && bridge.setReminder) {
    $('reminder-opt').hidden = false;
    syncReminderUi();
    $('opt-reminder').onchange = (e) => { reminder.on = e.target.checked; saveReminder(); };
    if (store.get('reminder', null) == null) {
      window.zzzArmReminder = () => { window.zzzArmReminder = null; if (store.get('reminder', null) == null) saveReminder(); };
    }
    $('opt-reminder-time').onchange = (e) => { if (e.target.value) { reminder.time = e.target.value; saveReminder(); } };
    window.zzzReminderDenied = () => {
      reminder.on = false; store.set('reminder', reminder); syncReminderUi();
      $('reminder-note').textContent = t('reminder_blocked');
      $('reminder-note').hidden = false;
    };
  }
  let lastAdsState = null;
  // Ads and the "Remove ads" purchase: only in the Android app; the browser version has no ads.
  if (bridge && bridge.adsState) {
    const showAds = (st) => {
      if (st) lastAdsState = Object.assign({}, st, { message: null });
      if (puz) { hintLabel(); showEnergy(); if (wrap.querySelector('.gate') && payLadderLevel()) load(); }
      if (!st || !st.available) { $('ads-opt').hidden = true; return; }
      $('ads-opt').hidden = false;
      const buy = $('ads-buy');
      if (st.adsRemoved) {
        $('ads-desc').textContent = t('ads_off');
        buy.hidden = true; $('ads-restore').hidden = true;
      } else {
        $('ads-desc').textContent = t('ads_desc');
        buy.hidden = false; $('ads-restore').hidden = false;
        buy.textContent = st.price ? t('remove_ads_price', { price: st.price }) : t('remove_ads');
      }
      $('ads-privacy').hidden = !st.privacyOptions;
      if (st.message) {
        const msg = STRINGS.en['msg_' + st.message] ? t('msg_' + st.message) : st.message; // the app sends message keys
        $('ads-desc').textContent = msg; toast(msg);
      }
    };
    window.zzzAdsState = showAds;
    try { showAds(JSON.parse(bridge.adsState())); } catch (_) {}
    $('ads-buy').onclick = () => bridge.buyRemoveAds();
    $('ads-restore').onclick = () => bridge.restorePurchase();
    $('ads-privacy').onclick = () => bridge.privacyOptions();
  }
  // Language: follows the device unless the player picks one. Static text carries data-i18n keys;
  // text built in code is redrawn by relabel() without restarting the puzzle.
  function applyLang() {
    lang = pickLang();
    rootEl.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    document.querySelectorAll('[data-i18n-title]').forEach((el) => el.setAttribute('title', t(el.dataset.i18nTitle)));
    const sel = $('opt-lang');
    sel.innerHTML = `<option value="system">${t('language_device')}</option>` +
      Object.entries(LANGS).map(([code, name]) => `<option value="${code}" lang="${code}">${name}</option>`).join('');
    sel.value = store.get('lang', 'system');
  }
  function relabel() {
    if (!puz) return;
    buildSizes();
    if (mode === 'learn') {
      $('lesson-step').textContent = t('lesson_step', { n: lesson + 1, total: LESSONS.length });
      $('lesson-text').innerHTML = t(LESSONS[lesson].text);
    }
    $('label').textContent = mode === 'learn' ? t('how_to_play') : mode === 'daily' ? today() : t('level_size', { level, size: puz.n });
    if (window.zzzAdsState && lastAdsState) window.zzzAdsState(lastAdsState);
    hintLabel(); showEnergy();
    const card = wrap.querySelector('.win');
    if (card) { card.remove(); if (card.classList.contains('gate')) showGate(); else showWin(); }
    applyA11y();
  }
  // Version line at the bottom of Settings: the app's version and build number on Android,
  // otherwise the date and commit that build.sh stamps into WEB_BUILD.
  const WEB_BUILD = '__WEB_BUILD__';
  function showVersion() {
    let v = '';
    try { if (bridge && bridge.appVersion) v = t('version', { v: bridge.appVersion() }); } catch (_) {}
    if (!v && !WEB_BUILD.startsWith('__')) v = t('version_web', { v: WEB_BUILD });
    $('version').textContent = v;
  }
  $('opt-lang').onchange = (e) => { store.set('lang', e.target.value); applyLang(); relabel(); showVersion(); };
  applyLang();
  showVersion();
  if (motionQuery && motionQuery.addEventListener) motionQuery.addEventListener('change', applyA11y);
  applyA11y();

  window.__zap = { get puz() { return puz; }, get path() { return path; }, get won() { return won; } };
  load();
})();
</script>
