name: Android build

# Builds the debug APK (test ads) and the release AAB for Play on every change to the game or the app.
# Optional repository secrets:
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD  sign the AAB for upload
#   ADMOB_APP_ID, ADMOB_REWARDED_ID (hints), ADMOB_REWARDED_ENERGY_ID, ADMOB_BANNER_ID  real ad IDs for the release build (Google's test IDs otherwise)
#   GOOGLE_SERVICES_JSON  contents of Firebase's google-services.json; turns on Analytics and Crashlytics
#   PLAY_GAMES_RESOURCES  Play Console's Play Games "Get resources" XML; turns on Play Games sign-in, achievements, leaderboards
on:
  push:
    branches: [main]
    paths: ['android/**', 'web/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'web/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ZZZ_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::No RELEASE_KEYSTORE_BASE64 secret, so the release AAB is unsigned."
          fi

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            echo "::notice::No GOOGLE_SERVICES_JSON secret, so this build has no Analytics or Crashlytics."
          fi

      - name: Write games-ids.xml
        env:
          PLAY_GAMES_RESOURCES: ${{ secrets.PLAY_GAMES_RESOURCES }}
        run: |
          if [ -n "$PLAY_GAMES_RESOURCES" ]; then
            printf '%s' "$PLAY_GAMES_RESOURCES" > res/values/games-ids.xml
          else
            echo "::notice::No PLAY_GAMES_RESOURCES secret, so this build has no Play Games."
          fi

      - name: Build
        env:
          ZZZ_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ZZZ_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ZZZ_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_REWARDED_ENERGY_ID: ${{ secrets.ADMOB_REWARDED_ENERGY_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Show the test APK's signing certificate
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          SHA1="$("$APKSIGNER" verify --print-certs build/outputs/apk/debug/*.apk | sed -n 's/.*SHA-1 digest: //p' | head -1 | sed 's/../&:/g; s/:$//' | tr a-f A-F)"
          echo "::notice::Test APK signing certificate SHA-1: $SHA1 (Play Games needs an Android credential with this SHA-1 for this APK to sign in)"
          SHA256="$("$APKSIGNER" verify --print-certs build/outputs/apk/debug/*.apk | sed -n 's/.*SHA-256 digest: //p' | head -1 | sed 's/../&:/g; s/:$//' | tr a-f A-F)"
          echo "::notice::Test APK signing certificate SHA-256: $SHA256 (add it to assetlinks.json so shared Daily links open this APK too)"

      - uses: actions/upload-artifact@v4
        with:
          name: zipzapzop-debug-apk
          path: android/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zipzapzop-release-aab
          path: android/build/outputs/bundle/release/*.aab
