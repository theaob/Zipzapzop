// The real Android build: ads, Play purchases, and the release AAB for Play.
// It runs in GitHub Actions (.github/workflows/android.yml); build-apk.sh is a local, ad-free shortcut.
plugins {
    id 'com.android.application' version '8.10.1'
    id 'com.google.gms.google-services' version '4.4.3' apply false
    id 'com.google.firebase.crashlytics' version '3.0.4' apply false
}

// Firebase (Analytics, Crashlytics) is wired up only when google-services.json is present: CI writes it from
// the GOOGLE_SERVICES_JSON secret. Without it the app builds the same and sends nothing.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

// Google's sample AdMob IDs, which only ever show test ads. Release builds take the real ones from
// -PadmobAppId=... -PadmobRewardedId=... -PadmobRewardedEnergyId=... (or ADMOB_APP_ID / ADMOB_REWARDED_ID /
// ADMOB_REWARDED_ENERGY_ID in CI). ADMOB_REWARDED_ID is the hint ad unit.
def testAppId = 'ca-app-pub-3940256099942544~3347511713'
def testRewardedId = 'ca-app-pub-3940256099942544/5224354917'
def prop = { String name, String env -> findProperty(name) ?: System.getenv(env) ?: null }
def releaseAppId = prop('admobAppId', 'ADMOB_APP_ID') ?: testAppId
def releaseRewardedId = prop('admobRewardedId', 'ADMOB_REWARDED_ID') ?: testRewardedId
def releaseRewardedEnergyId = prop('admobRewardedEnergyId', 'ADMOB_REWARDED_ENERGY_ID') ?: testRewardedId
def keystore = System.getenv('ZZZ_KEYSTORE_FILE')

android {
    namespace 'com.onurbaykal.zipzapzop'
    compileSdk 36

    defaultConfig {
        applicationId 'com.onurbaykal.zipzapzop'
        minSdk 24
        targetSdk 36
        versionCode((prop('versionCode', 'VERSION_CODE') ?: '1') as int)
        versionName '1.0'
    }

    // Keeps the flat layout build-apk.sh uses; src-ads/ holds the ads and billing code.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src', 'src-ads']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ZZZ_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ZZZ_KEY_ALIAS')
                keyPassword System.getenv('ZZZ_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: testAppId]
            buildConfigField 'String', 'ADMOB_REWARDED_HINT', "\"${testRewardedId}\""
            buildConfigField 'String', 'ADMOB_REWARDED_ENERGY', "\"${testRewardedId}\""
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [admobAppId: releaseAppId]
            buildConfigField 'String', 'ADMOB_REWARDED_HINT', "\"${releaseRewardedId}\""
            buildConfigField 'String', 'ADMOB_REWARDED_ENERGY', "\"${releaseRewardedEnergyId}\""
            if (keystore) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
}

// assets/index.html is generated from the web game, same as in build-apk.sh.
def gamePage = tasks.register('gamePage', Exec) {
    commandLine 'python3', 'make_page.py'
    inputs.files('make_page.py', '../web/page.html', '../web/engine.js')
    outputs.file('assets/index.html')
}
tasks.named('preBuild') { dependsOn gamePage }
